<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новая вкладка</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <div class="container">
    <div class="clock">
      <h1 class="logo" id="clockTime">--:--</h1>
      <div class="clock-date" id="clockDate"></div>
    </div>

    <form class="search-form" action="https://www.google.com/search" method="get">
      <span class="search-icon">+</span>
      <input type="text" name="q" class="search-input" placeholder="Поиск Google" autofocus autocomplete="off">
    </form>

    <div class="shortcuts" id="shortcuts"></div>

  </div>

  <aside class="notes-panel">
    <div class="notes-header">
      <span class="notes-title">Заметки</span>
      <button class="notes-add" id="notesAdd" title="Добавить заметку" aria-label="Добавить заметку">+</button>
    </div>
    <ul class="notes-list" id="notesList"></ul>
  </aside>

  <div class="right-column">
    <aside class="calendar-panel">
      <div class="calendar-header">
        <span class="calendar-title">Календарь</span>
        <button class="calendar-refresh" id="calendarRefresh" title="Обновить" aria-label="Обновить">↻</button>
      </div>
      <div class="calendar-content" id="calendarContent"></div>
    </aside>

    <aside class="mail-panel">
      <div class="mail-header">
        <span class="mail-title">Почта</span>
        <span class="mail-count" id="mailCount" hidden></span>
        <button class="mail-refresh" id="mailRefresh" title="Обновить" aria-label="Обновить">↻</button>
      </div>
      <div class="mail-content" id="mailContent"></div>
    </aside>
  </div>

  <div class="settings-container">
    <button class="settings-btn" id="settingsBtn" title="Настройки" aria-label="Настройки">⚙</button>
    <div class="settings-menu" id="settingsMenu" hidden>
      <button class="settings-item" id="bgBtn">Сменить фон</button>
      <input type="file" id="bgInput" accept="image/*" hidden>
      <button class="settings-item" id="bgResetBtn" hidden>Убрать фон</button>
      <div class="settings-separator"></div>
      <button class="settings-item" id="icalBtn">Подключить календарь (iCal)</button>
      <button class="settings-item" id="icalResetBtn" hidden>Отключить календарь</button>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modalTitle">Новый ярлык</h2>
      <label>Название</label>
      <input type="text" id="shortcutName" placeholder="Например, Gmail">
      <label>URL</label>
      <input type="text" id="shortcutUrl" placeholder="https://mail.google.com">
      <div class="modal-buttons">
        <button id="deleteBtn" class="btn-delete" style="display:none">Удалить</button>
        <button id="cancelBtn" class="btn-cancel">Отмена</button>
        <button id="saveBtn" class="btn-save">Сохранить</button>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
